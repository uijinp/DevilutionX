server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # pthread(SharedArrayBuffer) 를 쓰는 wasm 은 교차 출처 격리가 필수다.
    add_header Cross-Origin-Opener-Policy  same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/html;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # index.html 은 매번 재검증. js/wasm/data 는 ?v=BUILD_ID 로 URL 이 바뀌므로 길게 캐시해도 된다. mpq 는 거의 안 바뀐다.
    location ~* \.(js|wasm|data|mpq)$ { expires 30d; add_header Cache-Control "public, immutable"; 
        add_header Cross-Origin-Opener-Policy  same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always; }
    location = /index.html { expires -1; 
        add_header Cross-Origin-Opener-Policy  same-origin  always;
        add_header Cross-Origin-Embedder-Policy require-corp always; }
}
